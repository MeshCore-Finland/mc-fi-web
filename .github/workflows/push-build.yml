name: Push builds

on:
  push:

permissions:
  contents: read

concurrency:
  group: push-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
